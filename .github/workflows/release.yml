name: Build Release Asset

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create package
        run: |
          mkdir package
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='misc' \
            --exclude='README.md' \
            ./ package/itremote/

      - name: Create ZIP
        run: |
          cd package
          zip -r itremote.zip itremote

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: package/itremote.zip